<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>huymanmt • DevOps &amp; Cloud Platform</title>
    <meta name="description" content="Portfolio and Technical Blog of Nguyen Huynh Huy Man (@huymanmt) - DevOps Engineer & Cloud Platform Architect." />
    <link rel="icon" type="image/png" href="/app_icon.png" />
    <link rel="apple-touch-icon" href="/app_icon.png" />
    
    <!-- Theme flash prevention -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme') || localStorage.getItem('pref-theme');
        // Default to light mode unless dark is explicitly saved
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITETITLE }}{% endblock %}</title>
  
  <meta name="description" content="{% block description %}{{ BIO }}{% endblock %}">
  <meta name="author" content="Nguyen Huynh Huy Man (@huymanmt)">
  
  <link rel="icon" type="image/svg+xml" href="{{ SITEURL }}/favicon.svg">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/pygments.css">
  
  {% if FEED_ALL_ATOM %}
  <link href="{{ SITEURL }}/{{ FEED_ALL_ATOM }}" type="application/atom+xml" rel="alternate" title="{{ SITENAME }} Feed">
  {% endif %}

  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
<body>
  <div class="site-wrapper">
    <!-- Header -->
    <header class="site-header">
      <div class="header-inner">
        <a href="{{ SITEURL }}/" class="brand">
          <span class="brand-name">huymanmt</span>
        </a>

        <nav class="nav">
          {% for item in NAV_ITEMS %}
          <a href="{{ SITEURL }}{{ item.url }}" class="nav-item" {% if item.external %}target="_blank" rel="noopener"{% endif %}>
            {{ item.title }}
          </a>
          {% endfor %}
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark/Light Mode" title="Toggle theme">
            <span class="icon-sun">☼</span>
            <span class="icon-moon">☽</span>
          </button>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-left">
          <span>&copy; {{ CURRENT_YEAR }} Huy Man (<strong>@huymanmt</strong>)</span>
        </div>
        <div class="footer-links">
          {% for social in SOCIAL_LINKS %}
          <a href="{{ social.url }}" target="_blank" rel="noopener">{{ social.name }}</a>
          {% endfor %}
        </div>
      </div>
    </footer>
  </div>

  <script src="{{ SITEURL }}/theme/js/main.js"></script>
</body>
</html>
